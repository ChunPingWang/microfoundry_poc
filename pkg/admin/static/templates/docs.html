{{define "docs.html"}}
{{template "layout" .}}
{{end}}

{{define "content"}}
{{$c := .Content}}
{{$tab := "manual"}}
{{if $c}}{{with index $c "Tab"}}{{$tab = .}}{{end}}{{end}}
<div class="space-y-6">
    <div class="bg-white rounded-lg shadow">
        <!-- Tab Navigation -->
        <div class="border-b border-gray-200">
            <nav class="flex -mb-px overflow-x-auto" aria-label="Documentation tabs">
                <a href="/docs?tab=manual"
                   class="whitespace-nowrap py-4 px-6 font-medium text-sm border-b-2 {{if eq $tab "manual"}}border-blue-600 text-blue-600{{else}}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{{end}}"
                   data-tooltip="CLI commands, app lifecycle, services, secrets, and monitoring">
                    User Manual
                </a>
                <a href="/docs?tab=admin"
                   class="whitespace-nowrap py-4 px-6 font-medium text-sm border-b-2 {{if eq $tab "admin"}}border-blue-600 text-blue-600{{else}}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{{end}}"
                   data-tooltip="Dashboard pages, settings, API reference, and SCIM v2">
                    Admin Guide
                </a>
                <a href="/docs?tab=architecture"
                   class="whitespace-nowrap py-4 px-6 font-medium text-sm border-b-2 {{if eq $tab "architecture"}}border-blue-600 text-blue-600{{else}}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{{end}}"
                   data-tooltip="System design, K8s resource model, and project structure">
                    Architecture
                </a>
            </nav>
        </div>

        <!-- Rendered markdown content -->
        <div class="p-6 docs-content">
            {{if $c}}{{safeHTML (index $c "HTML")}}{{end}}
        </div>
    </div>
</div>

<style>
/* Markdown rendered content styling */
.docs-content h1 { font-size: 1.875rem; font-weight: 700; color: #111827; margin-top: 2rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e5e7eb; }
.docs-content h2 { font-size: 1.5rem; font-weight: 600; color: #1f2937; margin-top: 1.75rem; margin-bottom: 0.75rem; padding-bottom: 0.25rem; border-bottom: 1px solid #f3f4f6; }
.docs-content h3 { font-size: 1.25rem; font-weight: 600; color: #374151; margin-top: 1.5rem; margin-bottom: 0.5rem; }
.docs-content h4 { font-size: 1.125rem; font-weight: 600; color: #4b5563; margin-top: 1.25rem; margin-bottom: 0.5rem; }
.docs-content p { color: #374151; line-height: 1.75; margin-bottom: 1rem; }
.docs-content a { color: #2563eb; text-decoration: underline; }
.docs-content a:hover { color: #1d4ed8; }
.docs-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #374151; }
.docs-content ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; color: #374151; }
.docs-content li { margin-bottom: 0.25rem; line-height: 1.625; }
.docs-content code { background: #f3f4f6; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; color: #dc2626; }
.docs-content pre { background: #1f2937; color: #e5e7eb; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; font-size: 0.875rem; line-height: 1.625; }
.docs-content pre code { background: transparent; padding: 0; color: inherit; font-size: inherit; }
.docs-content blockquote { border-left: 4px solid #d1d5db; padding-left: 1rem; color: #6b7280; font-style: italic; margin-bottom: 1rem; }
.docs-content table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.875rem; }
.docs-content thead th { background: #f9fafb; padding: 0.75rem 1rem; text-align: left; font-weight: 600; color: #374151; border-bottom: 2px solid #e5e7eb; }
.docs-content tbody td { padding: 0.75rem 1rem; border-bottom: 1px solid #f3f4f6; color: #4b5563; }
.docs-content tbody tr:hover { background: #f9fafb; }
.docs-content hr { border: none; border-top: 1px solid #e5e7eb; margin: 2rem 0; }
.docs-content img { max-width: 100%; border-radius: 0.5rem; margin: 1rem 0; }
.docs-content strong { font-weight: 600; color: #111827; }
</style>
{{end}}
