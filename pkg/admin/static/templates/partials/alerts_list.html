{{define "alerts_list.html"}}
{{$alerts := index . "Alerts"}}
{{if $alerts}}
<div class="space-y-2">
    {{range $alerts}}
    <div class="flex items-center justify-between p-3 rounded-lg
                {{if eq .Severity "critical"}}bg-red-50 border border-red-200
                {{else if eq .Severity "warning"}}bg-yellow-50 border border-yellow-200
                {{else}}bg-blue-50 border border-blue-200{{end}}">
        <div class="flex items-center space-x-3">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium
                  {{if eq .Status "firing"}}bg-red-100 text-red-800
                  {{else}}bg-green-100 text-green-800{{end}}">
                {{.Status}}
            </span>
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium
                  {{if eq .Severity "critical"}}bg-red-100 text-red-800
                  {{else if eq .Severity "warning"}}bg-yellow-100 text-yellow-800
                  {{else}}bg-blue-100 text-blue-800{{end}}">
                {{.Severity}}
            </span>
            <div>
                <p class="text-sm font-medium text-gray-900">{{.Name}}</p>
                <p class="text-xs text-gray-500">{{.Summary}}</p>
            </div>
        </div>
        <span class="text-xs text-gray-400">{{timeAgo .StartsAt}}</span>
    </div>
    {{end}}
</div>
{{else}}
<div class="text-center py-8">
    <svg class="mx-auto h-8 w-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <p class="mt-2 text-sm text-gray-500">No active alerts</p>
</div>
{{end}}
{{end}}
