{{define "tab_logs.html"}}
<div class="space-y-6">
    <!-- Historical Logs (Loki) -->
    <div class="bg-gray-50 rounded-lg p-4">
        <div class="flex items-center justify-between mb-3">
            <h4 class="text-sm font-medium text-gray-700">Historical Logs (Loki)</h4>
            <div class="flex items-center space-x-2">
                <select id="log-duration"
                        class="text-sm border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    <option value="15m">Last 15 minutes</option>
                    <option value="1h" selected>Last 1 hour</option>
                    <option value="6h">Last 6 hours</option>
                    <option value="24h">Last 24 hours</option>
                </select>
                <button hx-get="/apps/{{.Name}}/logs/history"
                        hx-target="#log-history-result"
                        hx-include="#log-duration"
                        hx-params="duration"
                        hx-indicator="#log-history-spinner"
                        class="px-3 py-1.5 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">
                    Query
                </button>
                <svg id="log-history-spinner" class="htmx-indicator w-4 h-4 animate-spin text-blue-600" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </div>
        </div>
        <div id="log-history-result">
            <p class="text-sm text-gray-400 text-center py-4">Select a time range and click "Query" to view historical logs</p>
        </div>
    </div>

    <!-- Live Streaming -->
    <div>
    <div class="flex items-center justify-between mb-4">
        <p class="text-sm text-gray-500">Live log stream from all instances</p>
        <button id="log-toggle"
                onclick="toggleLogs('{{.Name}}')"
                class="px-3 py-1.5 text-sm bg-green-600 text-white rounded hover:bg-green-700 transition-colors">
            Start Streaming
        </button>
    </div>
    <div id="log-container" class="hidden">
        <div hx-ext="sse" id="log-sse-container">
            <pre id="log-output"
                 class="bg-gray-900 text-green-400 p-4 overflow-y-auto font-mono text-xs leading-relaxed rounded-lg"
                 style="max-height: 500px;">
            </pre>
        </div>
    </div>
    <div id="log-placeholder" class="bg-gray-900 rounded-lg p-8 text-center">
        <p class="text-gray-500 text-sm">Click "Start Streaming" to view live logs</p>
    </div>
</div>

<script>
function toggleLogs(appName) {
    var container = document.getElementById('log-container');
    var placeholder = document.getElementById('log-placeholder');
    var toggle = document.getElementById('log-toggle');
    var sseContainer = document.getElementById('log-sse-container');
    var logOutput = document.getElementById('log-output');

    if (container.classList.contains('hidden')) {
        container.classList.remove('hidden');
        placeholder.classList.add('hidden');
        toggle.textContent = 'Stop Streaming';
        toggle.classList.remove('bg-green-600', 'hover:bg-green-700');
        toggle.classList.add('bg-red-600', 'hover:bg-red-700');

        sseContainer.setAttribute('sse-connect', '/apps/' + appName + '/logs/stream');
        logOutput.setAttribute('sse-swap', 'message');
        logOutput.setAttribute('hx-swap', 'beforeend scroll:bottom');
        htmx.process(sseContainer);
    } else {
        container.classList.add('hidden');
        placeholder.classList.remove('hidden');
        toggle.textContent = 'Start Streaming';
        toggle.classList.remove('bg-red-600', 'hover:bg-red-700');
        toggle.classList.add('bg-green-600', 'hover:bg-green-700');

        sseContainer.removeAttribute('sse-connect');
        logOutput.removeAttribute('sse-swap');
        logOutput.innerHTML = '';
        htmx.process(sseContainer);
    }
}
</script>
</div>
{{end}}
