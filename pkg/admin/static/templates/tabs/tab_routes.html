{{define "tab_routes.html"}}
<div>
    {{if .Routes}}
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Host</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Domain</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Path</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Protocol</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">URL</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            {{range .Routes}}
            <tr>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{.Host}}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{.Domain}}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{if .Path}}{{.Path}}{{else}}/{{end}}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{.Protocol}}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm">
                    <a href="{{.Protocol}}://{{.URL}}" target="_blank" class="text-blue-600 hover:underline">{{.Protocol}}://{{.URL}}</a>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
    {{else}}
    <div class="text-center py-12">
        <svg class="w-12 h-12 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
        </svg>
        <p class="text-gray-500 text-lg font-medium">No routes mapped</p>
        <p class="text-gray-400 text-sm mt-1">Use <code class="bg-gray-100 px-1.5 py-0.5 rounded text-gray-700">mf map-route</code> to create a route</p>
    </div>
    {{end}}
</div>
{{end}}
