{{define "app_instances.html"}}
<table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
        <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">#</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">State</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Since</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Restarts</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Node</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pod Name</th>
        </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
        {{range .Instances}}
        <tr>
            <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-700">#{{.Index}}</td>
            <td class="px-6 py-3 whitespace-nowrap">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium {{stateBg .State}}">
                    {{.State}}
                </span>
            </td>
            <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500">{{timeAgo .Since}}</td>
            <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500">{{.RestartCount}}</td>
            <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500">{{.NodeName}}</td>
            <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500 font-mono text-xs">{{.PodName}}</td>
        </tr>
        {{else}}
        <tr>
            <td colspan="6" class="px-6 py-8 text-center text-gray-500 text-sm">No instances running</td>
        </tr>
        {{end}}
    </tbody>
</table>
{{end}}
