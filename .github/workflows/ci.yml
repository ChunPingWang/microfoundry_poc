name: CI

on:
  push:
    branches: [rc]
  pull_request:
    branches: [rc]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v -count=1

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: microfoundry/mf:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
