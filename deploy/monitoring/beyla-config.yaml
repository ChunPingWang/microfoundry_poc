# Grafana Beyla - eBPF auto-instrumentation for MicroFoundry applications
# Netflix Atlas/Spectator-inspired: zero-code HTTP metrics collection
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beyla-config
  namespace: monitoring
data:
  beyla-config.yml: |
    log_level: info
    discovery:
      services:
        - k8s_namespace: microfoundry
          k8s_pod_labels:
            app.kubernetes.io/managed-by: microfoundry
    prometheus_export:
      port: 9090
      path: /metrics
    routes:
      patterns:
        - /api/{_}/{_}
        - /api/{_}
        - /health
        - /ready
        - /metrics
      unmatch: heuristic
    attributes:
      kubernetes:
        enable: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beyla
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: beyla
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: beyla
subjects:
  - kind: ServiceAccount
    name: beyla
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: beyla
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beyla
  namespace: monitoring
  labels:
    app.kubernetes.io/name: beyla
    app.kubernetes.io/component: auto-instrumentation
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: beyla
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beyla
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: beyla
      hostPID: true
      containers:
        - name: beyla
          image: grafana/beyla:latest
          securityContext:
            privileged: true
            runAsUser: 0
          ports:
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: BEYLA_CONFIG_PATH
              value: /config/beyla-config.yml
          volumeMounts:
            - name: beyla-config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
      volumes:
        - name: beyla-config
          configMap:
            name: beyla-config
---
apiVersion: v1
kind: Service
metadata:
  name: beyla-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: beyla
spec:
  selector:
    app.kubernetes.io/name: beyla
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: beyla-metrics
  namespace: monitoring
  labels:
    release: kube-prometheus
    app.kubernetes.io/name: beyla
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: beyla
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
      relabelings:
        - targetLabel: cluster
          replacement: docker-desktop
        - targetLabel: managed_by
          replacement: microfoundry
