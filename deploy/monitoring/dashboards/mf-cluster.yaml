apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mf-cluster
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  mf-cluster.json: |
    {
      "uid": "mf-cluster",
      "title": "MicroFoundry Cluster Resources",
      "tags": ["microfoundry", "cluster"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Node CPU Usage",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [{
            "expr": "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))",
            "legendFormat": "CPU"
          }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] } } }
        },
        {
          "id": 2,
          "title": "Node Memory Usage",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "targets": [{
            "expr": "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
            "legendFormat": "Memory"
          }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] } } }
        },
        {
          "id": 3,
          "title": "Pods by Namespace",
          "type": "piechart",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "targets": [{
            "expr": "count(kube_pod_info) by (namespace)",
            "legendFormat": "{{ namespace }}"
          }]
        },
        {
          "id": 4,
          "title": "MicroFoundry Pods",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "targets": [{
            "expr": "count(kube_pod_info{namespace=\"microfoundry\"})",
            "legendFormat": "Pods"
          }],
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{ "color": "blue", "value": 0 }] } } }
        },
        {
          "id": 5,
          "title": "CPU Usage by Namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) by (namespace)",
            "legendFormat": "{{ namespace }}"
          }],
          "fieldConfig": { "defaults": { "unit": "percentunit" } }
        },
        {
          "id": 6,
          "title": "Memory Usage by Namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [{
            "expr": "sum(container_memory_working_set_bytes{container!=\"\"}) by (namespace)",
            "legendFormat": "{{ namespace }}"
          }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 7,
          "title": "Pod Status (microfoundry)",
          "type": "table",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 14 },
          "targets": [{
            "expr": "kube_pod_status_phase{namespace=\"microfoundry\"} == 1",
            "legendFormat": "{{ pod }} - {{ phase }}",
            "format": "table",
            "instant": true
          }]
        }
      ],
      "schemaVersion": 39
    }
