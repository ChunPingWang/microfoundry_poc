apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microfoundry.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microfoundry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "microfoundry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "microfoundry.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "microfoundry.serviceAccountName" . }}
      containers:
        - name: mf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["admin"]
          ports:
            - name: http
              containerPort: {{ .Values.config.admin.port }}
              protocol: TCP
          env:
            {{- if .Values.auth.enabled }}
            - name: MF_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "microfoundry.fullname" . }}-auth
                  key: client-secret
                  optional: true
            - name: MF_AUTH_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "microfoundry.fullname" . }}-auth
                  key: session-key
                  optional: true
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/microfoundry
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "microfoundry.fullname" . }}-config
