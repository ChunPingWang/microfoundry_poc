{{- if .Values.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "microfoundry.fullname" . }}-auth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microfoundry.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.clientSecret }}
  client-secret: {{ .Values.auth.clientSecret | quote }}
  {{- end }}
  {{- if .Values.auth.sessionKey }}
  session-key: {{ .Values.auth.sessionKey | quote }}
  {{- end }}
{{- end }}
