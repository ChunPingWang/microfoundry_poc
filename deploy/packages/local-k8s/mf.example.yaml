# MicroFoundry Configuration — Local Kubernetes (Docker Desktop)
#
# Copy this file to ~/.mf/mf.yaml (or configs/mf.yaml in the project root)
# and adjust values to match your environment.
#
# This template is pre-configured for Docker Desktop Kubernetes with
# the nginx ingress controller and in-cluster monitoring stack.

# ---------------------------------------------------------------------------
# GitHub integration (optional — for source-based deployments)
# ---------------------------------------------------------------------------
github:
  owner: ""
  repo: ""

# ---------------------------------------------------------------------------
# Kubernetes cluster configuration
# ---------------------------------------------------------------------------
kubernetes:
  active: "docker-desktop"
  clusters:
    docker-desktop:
      name: "docker-desktop"
      context: "docker-desktop"
      namespace: "microfoundry"
      domain: "cf-local.dev"
      provider: "docker-desktop"
      enabled: true
      tls: false          # Set to true after running `mf setup tls`
      ingress_class: "nginx"

    # To use kind instead, uncomment and set active: "kind":
    # kind:
    #   name: "kind"
    #   context: "kind-kind"
    #   namespace: "microfoundry"
    #   domain: "cf-local.dev"
    #   provider: "kind"
    #   enabled: true
    #   ingress_class: "nginx"

    # To use minikube instead, uncomment and set active: "minikube":
    # minikube:
    #   name: "minikube"
    #   context: "minikube"
    #   namespace: "microfoundry"
    #   domain: "cf-local.dev"
    #   provider: "minikube"
    #   enabled: true
    #   ingress_class: "nginx"

# ---------------------------------------------------------------------------
# Admin server
# ---------------------------------------------------------------------------
admin:
  port: 8080
  host: "0.0.0.0"
  # domain: "admin.cf-local.dev"  # Uncomment after DNS / /etc/hosts setup
  # tls: true                     # Enable after running `mf setup tls`
  # tls_port: 8443                # HTTPS port (default: 8443)

# ---------------------------------------------------------------------------
# Admin UI feature toggles
# ---------------------------------------------------------------------------
ui:
  tooltips: true

# ---------------------------------------------------------------------------
# Monitoring — in-cluster services (deployed by install.sh --with-monitoring)
# ---------------------------------------------------------------------------
monitoring:
  grafana_url: "http://kube-prometheus-grafana.monitoring.svc.cluster.local:80"
  loki_url: "http://loki.monitoring.svc.cluster.local:3100"
  alertmanager_url: "http://kube-prometheus-kube-prome-alertmanager.monitoring.svc.cluster.local:9093"
  prometheus_url: "http://kube-prometheus-kube-prome-prometheus.monitoring.svc.cluster.local:9090"
  beyla_enabled: true

# ---------------------------------------------------------------------------
# Container registry (optional — configure via Admin UI or uncomment below)
# ---------------------------------------------------------------------------
# registry:
#   url: "harbor.local:30003"
#   project: "microfoundry"
#   username: "admin"
#   insecure: false

# ---------------------------------------------------------------------------
# SMTP server (optional — configure via Admin UI or uncomment below)
# ---------------------------------------------------------------------------
# smtp:
#   host: "smtp.gmail.com"
#   port: 587
#   username: "user@example.com"
#   from_addr: "noreply@microfoundry.local"
#   tls: true

# ---------------------------------------------------------------------------
# Authentication (Keycloak OIDC) — disabled by default
#
# To enable:
#   1. Deploy Keycloak:  mf setup keycloak
#   2. Uncomment the auth section below
#   3. Fill in client_secret from Keycloak admin console
#   4. Restart MicroFoundry
# ---------------------------------------------------------------------------
# auth:
#   enabled: true
#   issuer_url: "http://localhost:8180/realms/microfoundry"
#   client_id: "mf-admin"
#   client_secret: "your-client-secret"
#   redirect_url: "http://admin.cf-local.dev:8080/auth/callback"
#   session_key: ""  # 64-char hex string; auto-generated if empty
#   admin_base_url: "http://localhost:8180"
#   admin_client_id: "admin-cli"
#   admin_client_secret: "your-admin-secret"
#   realm: "microfoundry"
