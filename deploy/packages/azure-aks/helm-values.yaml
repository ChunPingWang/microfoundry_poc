# MicroFoundry Helm Values Override -- Azure AKS
# Target environment: Azure Kubernetes Service with AGIC
#
# Usage:
#   helm install microfoundry oci://ghcr.io/younjinjeong/microfoundry/charts/microfoundry \
#     -f helm-values.yaml -n microfoundry --create-namespace
#
# Note: When used via Terraform, template variables (${...}) are interpolated
# automatically. For standalone use, replace them with actual values.

replicaCount: 2

image:
  repository: ghcr.io/younjinjeong/microfoundry/mf
  pullPolicy: IfNotPresent
  # tag: "" -- defaults to Chart appVersion

# ---------------------------------------------------------------------------
# Namespace
# ---------------------------------------------------------------------------
namespace: microfoundry

# ---------------------------------------------------------------------------
# Service Account & RBAC -- Azure Workload Identity
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: microfoundry
  annotations:
    azure.workload.identity/client-id: "${client_id}"

rbac:
  create: true

# ---------------------------------------------------------------------------
# MicroFoundry application config
# ---------------------------------------------------------------------------
config:
  github:
    owner: ""
    repo: ""
  kubernetes:
    active: "aks"
    clusters:
      aks:
        name: "aks"
        context: "aks"
        namespace: microfoundry
        domain: "${domain}"
        provider: "aks"
        enabled: true
        ingress_class: "azure/application-gateway"
  admin:
    port: 8080
    host: "0.0.0.0"
    domain: "admin.${domain}"
    tls: true
  monitoring:
    # Azure Monitor replaces in-cluster monitoring stack.
    # Leave URLs empty; MicroFoundry detects the AKS provider and defers
    # to Azure Monitor / Log Analytics for observability.
    grafana_url: ""
    loki_url: ""
    alertmanager_url: ""
    prometheus_url: ""
    beyla_enabled: false

# ---------------------------------------------------------------------------
# Authentication -- configure after deployment
# ---------------------------------------------------------------------------
auth:
  enabled: false
  issuerUrl: ""
  clientId: "mf-admin"
  clientSecret: ""
  redirectUrl: ""
  sessionKey: ""
  adminBaseUrl: ""
  realm: "microfoundry"

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080

# ---------------------------------------------------------------------------
# Ingress -- Azure Application Gateway Ingress Controller (AGIC)
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: "azure-application-gateway"
  annotations:
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/backend-protocol: "HTTP"
    appgw.ingress.kubernetes.io/request-timeout: "300"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
  hosts:
    - host: "admin.${domain}"
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # To enable TLS, configure an Azure Key Vault certificate or create the
  # secret manually:
  #   kubectl create secret tls mf-tls-wildcard \
  #     --cert=cert.pem --key=key.pem -n microfoundry
  # tls:
  #   - secretName: mf-tls-wildcard
  #     hosts:
  #       - "admin.${domain}"
  #       - "*.${domain}"

# ---------------------------------------------------------------------------
# Provider hint -- used by MicroFoundry to enable AKS-specific behavior
# ---------------------------------------------------------------------------
provider: "aks"

# ---------------------------------------------------------------------------
# Resource limits -- production defaults for AKS
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
